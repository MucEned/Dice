<!doctype html>
<html lang="vi">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Roll Room | Dice Pool</title>
	<style>
		@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');

		:root {
			--ink: #263344;
			--muted: #768397;
			--line: #e4e9ee;
			--paper: #fbfcfd;
			--blue: #4d7cfe;
			--blue-soft: #eef3ff;
			--orange: #f5a85c;
			--shadow: 0 20px 55px rgba(44, 58, 77, .11);
		}

		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-width: 300px;
			color: var(--ink);
			background: #edf3f5;
			font-family: 'DM Sans', sans-serif;
		}
		body::before {
			content: '';
			position: fixed;
			inset: 0;
			pointer-events: none;
			opacity: .52;
			background-image: radial-gradient(#d4e0e2 1px, transparent 1px);
			background-size: 22px 22px;
		}
		button { font: inherit; cursor: pointer; }
		.app-shell { position: relative; max-width: 1280px; min-height: 100vh; margin: auto; padding: 22px 34px 25px; }
		header { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 17px; }
		.brand { display: flex; align-items: center; gap: 13px; }
		.brand-mark { display: grid; place-items: center; width: 40px; height: 40px; color: white; font-family: 'Space Grotesk'; font-size: 18px; border-radius: 12px; background: var(--blue); box-shadow: 0 8px 17px rgba(77, 124, 254, .25); transform: rotate(-4deg); }
		.brand h1 { margin: 0; font-family: 'Space Grotesk'; font-size: 19px; letter-spacing: -.7px; }
		.round-badge { display: flex; align-items: center; padding: 9px; border: 1px solid #dce5e9; border-radius: 99px; background: rgba(255,255,255,.7); }
		#roundLabel { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); }
		.status-dot { width: 7px; height: 7px; border-radius: 50%; background: #5ac791; box-shadow: 0 0 0 4px #e0f4e9; }
		.workspace { display: grid; grid-template-columns: minmax(0, 1fr) 310px; gap: 23px; }
		.panel { border: 1px solid rgba(221, 229, 234, .95); border-radius: 24px; background: rgba(255,255,255,.91); box-shadow: var(--shadow); }
		.pool-panel { min-height: calc(100vh - 47px); padding: 21px; }
		.panel-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 15px; }
		.eyebrow { display: none; }
		h2 { margin: 0; font-family: 'Space Grotesk'; font-size: clamp(24px, 3vw, 32px); letter-spacing: -1.2px; }
		.count-label { padding-top: 5px; color: var(--muted); font-size: 12px; white-space: nowrap; }
		.count-label strong { color: var(--ink); }
		.legend { display: none; }
		.dice-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(142px, 1fr)); gap: 12px; margin-top: 17px; }
		.empty-state { grid-column: 1 / -1; display: grid; place-items: center; min-height: 260px; color: var(--muted); text-align: center; }
		.empty-icon { display: grid; place-items: center; width: 54px; height: 54px; margin: 0 auto 12px; color: #99a8b5; font-size: 24px; border: 1px dashed #cbd6dc; border-radius: 16px; }
		.empty-state h3 { margin: 0; color: var(--ink); font-family: 'Space Grotesk'; font-size: 17px; }
		.empty-state p { display: none; }
		.die-card { position: relative; display: flex; flex-direction: column; align-items: center; min-height: 154px; padding: 8px 10px; border: 2px solid transparent; border-radius: 15px; background: rgba(255,255,255,.76); transition: transform .2s ease, box-shadow .2s ease; }
		.die-card:hover { transform: translateY(-3px); box-shadow: 0 10px 18px rgba(56, 76, 95, .1); }
		.die-card.is-locked { border-color: #f1b16e; }
		.die-card button { border: 0; }
		.die-face { display: grid; place-items: center; width: 82px; height: 82px; margin: 3px 0 5px; color: white; font-family: 'Space Grotesk'; font-size: 31px; border: 4px solid rgba(255,255,255,.7); border-radius: 0; background: var(--die-bg); box-shadow: 0 7px 11px rgba(70, 79, 88, .16); clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); }
		.die-face.sides-4 { clip-path: polygon(50% 0, 100% 100%, 0 100%); }
		.die-face.sides-8 { clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
		.die-face.sides-10 { clip-path: polygon(0 50%, 50% 0, 100% 50%, 50% 100%); }
		.die-face.sides-12 { clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%); }
		.die-face.sides-20 { clip-path: polygon(50% 0, 79.4% 9.5%, 97.6% 34.5%, 97.6% 65.5%, 79.4% 90.5%, 50% 100%, 20.6% 90.5%, 2.4% 65.5%, 2.4% 34.5%, 20.6% 9.5%); }
		.die-face:active { transform: scale(.94) rotate(3deg); }
		.die-type { color: #5f6d7b; font-size: 12px; font-weight: 700; letter-spacing: 1px; }
		.die-meta { position: absolute; right: 8px; bottom: 7px; display: flex; align-items: center; color: #8794a0; font-size: 0; }
		.mini-dot { width: 8px; height: 8px; border-radius: 50%; background: #5ac791; box-shadow: 0 0 0 2px rgba(255,255,255,.45); }
		.is-locked .mini-dot { background: #f3a561; }
		.remove-die { position: absolute; top: 5px; left: 7px; z-index: 1; padding: 0; color: rgba(38,51,68,.58); background: transparent; font-size: 19px; line-height: 1; opacity: 1; }
		.remove-die:hover { color: #d27474; }
		.die-card.rolling { animation: die-roll .48s cubic-bezier(.25,.8,.25,1); }
		.die-card.rolling .die-face { animation: face-roll .48s ease-in-out; }
		@keyframes die-roll { 0%, 100% { transform: translateY(0) rotate(0); } 25% { transform: translateY(-9px) rotate(-5deg); } 55% { transform: translateY(3px) rotate(5deg); } 80% { transform: translateY(-3px) rotate(-2deg); } }
		@keyframes face-roll { 0%, 100% { filter: blur(0); } 45% { filter: blur(3px); transform: scale(.9) rotate(10deg); } }
		.toolbar { display: flex; align-items: center; justify-content: flex-end; gap: 12px; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
		.primary-btn, .secondary-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 43px; padding: 0 17px; border-radius: 12px; font-size: 13px; font-weight: 700; transition: transform .15s, background .15s; }
		.primary-btn { color: white; border: 0; background: var(--blue); box-shadow: 0 7px 15px rgba(77, 124, 254, .22); }
		.primary-btn:hover { background: #3869ec; transform: translateY(-1px); }
		.secondary-btn { color: #5d6e7d; border: 1px solid #dce4e9; background: white; }
		.secondary-btn:hover { background: #f7fafb; }
		.side-panel { display: flex; flex-direction: column; padding: 20px; }
		.side-panel h3 { margin: 0 0 15px; font-family: 'Space Grotesk'; font-size: 18px; }
		.side-copy { display: none; }
		.add-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
		.add-die { display: flex; align-items: center; justify-content: space-between; min-height: 44px; padding: 0 11px; color: var(--ink); border: 1px solid #e2e8ec; border-radius: 11px; background: #fff; font-size: 12px; font-weight: 700; }
		.add-die:hover { border-color: var(--blue); background: var(--blue-soft); }
		.plus { color: var(--blue); font-size: 18px; font-weight: 400; }
		.summary { margin-top: auto; padding-top: 18px; }
		.summary-title { display: flex; justify-content: space-between; margin-bottom: 10px; color: var(--muted); font-size: 11px; }
		.summary-title strong { color: var(--ink); }
		.summary-bar { overflow: hidden; height: 8px; border-radius: 10px; background: #edf1f3; }
		.summary-fill { width: 0%; height: 100%; border-radius: inherit; background: var(--orange); transition: width .3s; }
		.tip { display: none; }
		@media (max-width: 800px) { .app-shell { padding: 14px 12px 17px; } .workspace { grid-template-columns: 1fr; gap: 12px; } .pool-panel { min-height: auto; padding: 16px 14px; } .side-panel { min-height: auto; padding: 15px; } .summary { display: none; } .side-panel h3 { margin-bottom: 10px; } .add-list { gap: 6px; } .add-die { min-height: 35px; } }
		@media (max-width: 470px) { .pool-panel { border-radius: 18px; } .dice-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 12px; } .die-card { min-height: 124px; padding: 6px 8px; border-radius: 13px; } .die-face { width: 65px; height: 65px; margin: 1px 0 3px; font-size: 25px; } .die-meta { right: 7px; bottom: 6px; } .remove-die { top: 4px; left: 6px; } .toolbar { margin-top: 12px; padding-top: 12px; } .primary-btn { width: 100%; } }
		@media (min-width: 801px) and (max-height: 700px) { .app-shell { padding-top: 14px; } .pool-panel { min-height: calc(100vh - 80px); } }
	</style>
</head>
<body>
	<main class="app-shell">
		<section class="workspace">
			<section class="panel pool-panel">
				<div class="panel-heading"><div><p class="eyebrow">Active collection</p><h2>Your dice pool</h2></div><div class="count-label"><strong id="poolCount">0 dice</strong><br><span id="activeCount">0 active</span></div></div>
				<div class="legend"><span><i class="available"></i> Available to roll</span><span><i class="locked"></i> Locked in place</span></div>
				<div id="diceGrid" class="dice-grid"></div>
				<div class="toolbar"><button class="primary-btn" id="rollButton">↻&nbsp; Roll</button></div>
			</section>
			<aside class="panel side-panel">
				<h3>Add a die</h3>
				<div class="add-list" id="addList"></div>
				<div class="summary"><div class="summary-title"><span>Pool</span><strong id="capacityLabel">0 / 12</strong></div><div class="summary-bar"><div class="summary-fill" id="capacityFill"></div></div></div>
			</aside>
		</section>
	</main>
	<script>
		const dieTypes = [4, 6, 8, 10, 12, 20];
		const pastelColors = ['#f9c8c8', '#f8d9a8', '#f5efad', '#c6e8d3', '#c5def7', '#d9cdf4', '#f2c9e5', '#c8e4e3', '#e8d4bd', '#d2e8bb', '#f7c9ac', '#cbd5f3'];
		const dice = [];
		let nextId = 1;
		let round = 0;
		const grid = document.querySelector('#diceGrid');
		const addList = document.querySelector('#addList');
		const poolCount = document.querySelector('#poolCount');
		const activeCount = document.querySelector('#activeCount');
		const roundLabel = document.querySelector('#roundLabel');
		const capacityLabel = document.querySelector('#capacityLabel');
		const capacityFill = document.querySelector('#capacityFill');
		const rollingIds = new Set();
		const rollButton = document.querySelector('#rollButton');

		function renderAddButtons() {
			addList.innerHTML = dieTypes.map(type => `<button class="add-die" data-add="${type}">D${type}<span class="plus">+</span></button>`).join('');
			addList.querySelectorAll('[data-add]').forEach(button => button.addEventListener('click', () => addDie(Number(button.dataset.add))));
		}

		function addDie(sides) {
			if (dice.length >= 12) return;
			dice.push({ id: nextId++, sides, value: rollValue(sides), locked: false, color: pastelColors[dice.length] });
			render();
		}

		function rollValue(sides) { return Math.floor(Math.random() * sides) + 1; }

		function toggleLock(id) {
			const die = dice.find(item => item.id === id);
			if (die) { die.locked = !die.locked; render(); }
		}

		function rollAll() {
			const active = dice.filter(die => !die.locked);
			if (!active.length) { if (roundLabel) roundLabel.textContent = 'Everything is locked'; return; }
			active.forEach(die => rollingIds.add(die.id));
			rollButton.disabled = true;
			render();
			setTimeout(() => {
				active.forEach(die => { die.value = rollValue(die.sides); rollingIds.delete(die.id); });
				round += 1;
				if (roundLabel) roundLabel.textContent = `Round ${round} complete`;
				rollButton.disabled = false;
				render();
			}, 480);
		}

		function removeDie(id) {
			const index = dice.findIndex(die => die.id === id);
			if (index > -1) dice.splice(index, 1);
			dice.forEach((die, position) => { die.color = pastelColors[position]; });
			render();
		}

		function render() {
			const active = dice.filter(die => !die.locked).length;
			poolCount.textContent = `${dice.length} ${dice.length === 1 ? 'die' : 'dice'}`;
			activeCount.textContent = `${active} active`;
			capacityLabel.textContent = `${dice.length} / 12`;
			capacityFill.style.width = `${dice.length / 12 * 100}%`;
			grid.innerHTML = dice.length ? dice.map(die => `<article class="die-card ${die.locked ? 'is-locked' : ''} ${rollingIds.has(die.id) ? 'rolling' : ''}" style="--die-bg:${die.color}"><button class="die-face sides-${die.sides}" aria-label="D${die.sides}, value ${die.value}. Click to ${die.locked ? 'unlock' : 'lock'}" data-toggle="${die.id}">${die.value}</button><div class="die-type">D${die.sides}</div><div class="die-meta"><span class="mini-dot"></span></div><button class="remove-die" data-remove="${die.id}" aria-label="Remove D${die.sides}">×</button></article>`).join('') : `<div class="empty-state"><div><div class="empty-icon">＋</div><h3>Your pool is empty</h3><p>Pick a die from the panel to start your next roll.</p></div></div>`;
			grid.querySelectorAll('[data-toggle]').forEach(button => button.addEventListener('click', () => toggleLock(Number(button.dataset.toggle))));
			grid.querySelectorAll('[data-remove]').forEach(button => button.addEventListener('click', () => removeDie(Number(button.dataset.remove))));
		}

		document.querySelector('#rollButton').addEventListener('click', rollAll);
		renderAddButtons();
		addDie(4); addDie(20); addDie(8);
	</script>
</body>
</html>
